<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Scope</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #E91E8C, #FF4DAF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #888; margin-bottom: 2rem; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: block;
      padding: 1rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .wb {
      background: linear-gradient(135deg, #d4a843, #e8c86a);
      color: #1a1a2e;
    }
    .generic {
      background: linear-gradient(135deg, #E91E8C, #FF4DAF);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Studio Scope</h1>
    <p>Social Growth Forecasting Dashboard</p>
    <div class="links">
      <a href="/studio-scope/" class="wb">WB Studio Tour</a>
      <a href="/studio-scope-generic/" class="generic">Generic Version</a>
    </div>
  </div>
</body>
</html>
